server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow JS to be embedded anywhere
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "*";

    # DO NOT BLOCK iframe usage
    # (Important: do NOT use X-Frame-Options DENY)
    add_header X-Frame-Options "ALLOWALL";

    # Modern alternative for iframe control
    add_header Content-Security-Policy "frame-ancestors *";

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # embed.js should NOT be cached aggressively (so you can update it)
    location = /embed.js {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # SPA routing for /chat and /launcher
    location / {
        try_files $uri /index.html;
    }
}